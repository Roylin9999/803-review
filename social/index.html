:root{

:root[data-theme="dark"]{

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px 24px;box-shadow:6px 6px 0 var(--ink)}

.nav a[data-g="7"]{box-shadow:3px 3px 0 var(--g7)} .nav a[data-g="8"]{box-shadow:3px 3px 0 var(--g8)} .nav a[data-g="9"]{box-shadow:3px 3px 0 var(--g9)} .nav a[data-g="all"]{box-shadow:3px 3px 0 var(--sun)}

.card{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 16px 14px;min-width:0}

.kind{font-size:12px;color:var(--muted)}

.card.live{border:2px solid var(--ink);box-shadow:5px 5px 0 var(--c);background:linear-gradient(var(--card),var(--card)) padding-box}

.card.live .pointer{position:absolute;right:-6px;bottom:52px;width:70px;pointer-events:none}
.card.extra{border-style:dashed}

.g7{--c:var(--g7);--soft:var(--g7-soft)} .g8{--c:var(--g8);--soft:var(--g8-soft)} .g9{--c:var(--g9);--soft:var(--g9-soft)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* subject blocks */
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

.filt button[aria-pressed="true"]{border-color:var(--ink);background:var(--sun);color:#1d2a2a}
.subj{margin:6px 0 22px}
.subj[hidden]{display:none}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.shead b{font-family:var(--display);font-size:20px;color:var(--ink);background:var(--soft);border:2px solid var(--c);border-radius:10px;padding:0 12px}

.vhead h4{font-family:var(--display);font-size:22px;margin:0}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}

.vtag{align-self:flex-start;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink);border-radius:6px;padding:1px 8px}
.vcard h5{font-family:var(--display);font-size:18px;margin:0;line-height:1.3}
.vcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.vcard.wip .ph{aspect-ratio:9/16;border:2px dashed var(--stamp);border-radius:12px;display:grid;place-items:center;color:var(--stamp);font-weight:700;text-align:center;padding:10px}
.vcard.wip{grid-column:1/-1}.vcard.wip .ph{aspect-ratio:auto!important;padding:14px}
.card .vlink{font-size:13px;font-weight:700;color:var(--c);text-decoration:none;border-bottom:2px solid var(--soft)}

function card(it){
  total++;

  const el=document.createElement("article");
  el.className="card"+(url?" live":"")+(it.extra?" extra":"");
  el.innerHTML=`${url?'<span class="badge">已開放</span>':''}
    <div class="no"><span>${it.extra?"★":it.label.slice(1,2)}</span>${it.label}</div>
    <h3>${it.t}</h3>
    <ul class="chips">${it.k.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="foot">${url
      ?`<a class="go" href="${url}" target="_blank" rel="noopener">開始上課 ▶</a><span class="kind">互動課 · 有語音</span>`
      :`<span class="soon">即將推出</span><span class="kind">準備中</span>`}</div>

  return el;
}
function vids(k,lesson){
  const V=VIDEOS[k], el=document.createElement("div");
  el.className="vids"; el.id="v-"+k;
  el.innerHTML=`<div class="vhead"><h4>🎬 ${V.title}</h4><small>${lesson} · 穿越短片</small></div><p>${V.note}</p>
   <div class="vgrid">${V.list.map(v=>`<figure class="vcard" style="margin:0"><span class="vtag">${v.tag}</span>
     <video controls playsinline preload="none" poster="${v.poster}" src="${v.src}" aria-label="第${v.ep}集 ${v.t}"></video>
     <h5>第${v.ep}集　${v.t}</h5><p>${v.d}</p></figure>`).join("")}
     ${V.soon?`<div class="vcard wip"><div class="ph">🎞️<br>${V.soon}</div></div>`:""}</div>`;
  return el;
}

  document.querySelectorAll("#grades section").forEach(sec=>sec.hidden=!(g==="all"||sec.id==="g"+g));
  if(scroll && nav.getBoundingClientRect().top<=1) window.scrollTo({top:nav.offsetTop-10,behavior:"smooth"});
}
gl.forEach(a=>a.onclick=e=>{

  let g=a.dataset.g;

  try{history.replaceState(null,"",g==="all"?location.pathname+location.search:"#g"+g)}catch(_){}
  setG(g,true);
});
